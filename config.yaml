model_list:

  # 🔹 Premium modellen
  - model_name: gpt4o
    litellm_params:
      model: azure/gpt-4o
      api_base: ${AZURE_API_BASE}
      api_key: ${AZURE_API_KEY}
      api_version: ${AZURE_API_VERSION}

  - model_name: gpt41
    litellm_params:
      model: azure/gpt-4.1
      api_base: ${AZURE_API_BASE}
      api_key: ${AZURE_API_KEY}
      api_version: ${AZURE_API_VERSION}

  - model_name: gpt5
    litellm_params:
      model: azure/gpt-5
      api_base: ${AZURE_API_BASE}
      api_key: ${AZURE_API_KEY}
      api_version: ${AZURE_API_VERSION}

  # 🔹 Snelle / goedkopere modellen
  - model_name: gpt4o-mini
    litellm_params:
      model: azure/gpt-4o-mini
      api_base: ${AZURE_API_BASE}
      api_key: ${AZURE_API_KEY}
      api_version: ${AZURE_API_VERSION}

  - model_name: gpt5-nano
    litellm_params:
      model: azure/gpt-5-nano
      api_base: ${AZURE_API_BASE}
      api_key: ${AZURE_API_KEY}
      api_version: ${AZURE_API_VERSION}

  # 🔹 Alternatief model
  - model_name: mistral
    litellm_params:
      model: azure/mistral-medium-2505
      api_base: ${AZURE_API_BASE}
      api_key: ${AZURE_API_KEY}
      api_version: ${AZURE_API_VERSION}
